# Integración continua: en cada push a main y en cada pull request se compila la app en las cuatro
# combinaciones (Debug/Release, x64/x86) y se ejecutan las pruebas unitarias de tests/SaviumDrive.Tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar (${{ matrix.configuration }} ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar la app
        run: dotnet build SaviumDrive/SaviumDrive.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -nologo

  test:
    name: Pruebas unitarias
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ejecutar pruebas
        run: dotnet test tests/SaviumDrive.Tests/SaviumDrive.Tests.csproj -c Release -nologo --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      # Resultados descargables desde la ejecución en GitHub, también si alguna prueba falla
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults
